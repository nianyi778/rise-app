name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

  miniprogram:
    name: Miniprogram — typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install miniprogram typings
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --project miniprogram/tsconfig.json
