<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Rise · 启动页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose:     #E06844;
      --rose-dk:  #C4522E;
      --ink:      #1B1928;
      --ink-mid:  #3B3650;
      --ink-soft: #68637A;
    }

    body {
      min-height: 100vh;
      background: #201C2E;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, sans-serif;
    }

    /* ── Phone shell ── */
    .phone {
      width: 375px;
      height: 812px;
      border-radius: 54px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.13),
        0 0 0 10px rgba(8,6,16,0.96),
        0 0 0 11px rgba(255,255,255,0.06),
        0 48px 120px rgba(0,0,0,0.55);
    }

    /* ── Dynamic Island ── */
    .isle {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      width: 118px; height: 34px;
      background: #040212;
      border-radius: 20px;
      z-index: 100;
    }

    /* ── Sunrise background ── */
    .bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        175deg,
        #EAE5F6 0%,
        #F2DDD0 38%,
        #F0C9B0 68%,
        #EDBF9A 100%
      );
      z-index: 0;
    }

    /* Ambient sun glow behind everything */
    .bg::before {
      content: '';
      position: absolute;
      bottom: 240px; left: 50%;
      transform: translateX(-50%);
      width: 380px; height: 320px;
      background: radial-gradient(ellipse,
        rgba(224,104,68,0.26) 0%,
        rgba(244,168,120,0.12) 40%,
        transparent 70%
      );
      border-radius: 50%;
    }

    /* Soft violet glow at top */
    .bg::after {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 240px;
      background: radial-gradient(ellipse,
        rgba(160,140,220,0.20) 0%,
        transparent 68%
      );
      border-radius: 50%;
    }

    /* ── Screen layout ── */
    .screen {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Status bar */
    .sb {
      width: 100%;
      height: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      flex-shrink: 0;
    }
    .sb-t { font-size: 15px; font-weight: 700; color: var(--ink); opacity: 0.55; }
    .sb-r { display: flex; gap: 5px; align-items: center; opacity: 0.55; }

    /* ── Main content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 72px;
      gap: 0;
    }

    /* ── Sun illustration ── */
    .sun-wrap {
      width: 240px;
      height: 186px;
      margin-bottom: 40px;
      position: relative;
    }

    .sun-svg {
      width: 100%;
      height: 100%;
      transform-origin: 50% 75%;
      animation: sunBreathe 5s ease-in-out infinite;
    }

    @keyframes sunBreathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.035); }
    }

    .ray { animation: rayGlow 5s ease-in-out infinite; }
    @keyframes rayGlow {
      0%, 100% { opacity: var(--op, 0.55); }
      50%       { opacity: calc(var(--op, 0.55) + 0.25); }
    }

    .glow-ring { animation: glowPulse 5s ease-in-out infinite; }
    @keyframes glowPulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.08); opacity: 0.85; }
    }

    /* ── Wordmark ── */
    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 11px;
      margin-bottom: 28px;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s both;
    }

    .wm-en {
      font-size: 80px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -5px;
      line-height: 1;
    }

    .wm-zh-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-bottom: 6px;
    }

    .wm-zh {
      font-size: 20px;
      font-weight: 700;
      color: var(--rose);
      line-height: 1;
    }

    .wm-py {
      font-size: 9px;
      font-weight: 500;
      color: var(--rose);
      opacity: 0.65;
      letter-spacing: 1.2px;
      text-transform: lowercase;
    }

    /* ── Rule ── */
    .rule {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(224,104,68,0.4), transparent);
      margin-bottom: 28px;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.4s both;
    }

    /* ── Slogan ── */
    .slogan {
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.6s both;
    }

    .sl-line {
      display: block;
      font-size: 17px;
      font-weight: 400;
      color: var(--ink-soft);
      line-height: 2.0;
      letter-spacing: 0.5px;
    }

    .sl-em {
      font-weight: 700;
      color: var(--ink-mid);
    }

    .sl-cta {
      display: block;
      margin-top: 20px;
      font-size: 28px;
      font-weight: 900;
      color: var(--rose);
      letter-spacing: -1px;
      line-height: 1;
    }

    /* ── Bottom dots ── */
    .dots {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dot {
      width: 5px; height: 5px;
      background: var(--rose);
      border-radius: 50%;
      opacity: 0.25;
    }
    .dot.on {
      width: 22px;
      border-radius: 3px;
      opacity: 1;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="isle"></div>
  <div class="bg"></div>

  <div class="screen">

    <!-- Status bar -->
    <div class="sb">
      <span class="sb-t">9:41</span>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="var(--ink)">
          <rect x="0" y="4" width="3" height="8" rx="1"/>
          <rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/>
          <rect x="9" y="0" width="3" height="12" rx="1"/>
          <rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".25"/>
        </svg>
        <svg width="20" height="12" viewBox="0 0 22 12" fill="none">
          <rect x=".5" y=".5" width="18" height="11" rx="2" stroke="var(--ink)" stroke-width="1.4"/>
          <rect x="2" y="2" width="13" height="8" rx="1" fill="var(--ink)"/>
          <path d="M20 4v4a2 2 0 0 0 0-4z" fill="var(--ink)"/>
        </svg>
      </div>
    </div>

    <!-- Main content -->
    <div class="content">

      <!-- ── Sun SVG ── -->
      <div class="sun-wrap">
        <svg class="sun-svg" viewBox="0 0 240 186" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Sun gradient: warm center → deep orange edge -->
            <radialGradient id="sg" cx="50%" cy="44%" r="56%">
              <stop offset="0%"   stop-color="#FFD590"/>
              <stop offset="42%"  stop-color="#F08848"/>
              <stop offset="100%" stop-color="#D4531E"/>
            </radialGradient>
            <!-- Glow gradient -->
            <radialGradient id="gg" cx="50%" cy="76%" r="52%">
              <stop offset="0%"   stop-color="#E06844" stop-opacity="0.22"/>
              <stop offset="55%"  stop-color="#E06844" stop-opacity="0.07"/>
              <stop offset="100%" stop-color="#E06844" stop-opacity="0"/>
            </radialGradient>
            <!-- Clip: only show sun above horizon (y=148) -->
            <clipPath id="above">
              <rect x="0" y="0" width="240" height="148"/>
            </clipPath>
          </defs>

          <!-- Outer ambient glow -->
          <ellipse class="glow-ring" cx="120" cy="148" rx="110" ry="74" fill="url(#gg)"/>

          <!-- Inner warm glow -->
          <ellipse cx="120" cy="148" rx="70" ry="48"
            fill="rgba(224,104,68,0.13)"/>

          <!-- ── Light rays (from sun center 120,118, radius 48) ── -->
          <!-- each ray: starts just past sun surface, extends outward -->

          <!-- 12 o'clock -->
          <line class="ray" style="--op:0.65"
            x1="120" y1="66" x2="120" y2="28"
            stroke="#E06844" stroke-width="2.2" stroke-linecap="round"/>

          <!-- 10:30 / ~40° left -->
          <line class="ray" style="--op:0.50"
            x1="88"  y1="79"  x2="66"  y2="54"
            stroke="#E06844" stroke-width="2" stroke-linecap="round"/>

          <!-- 1:30 / ~40° right -->
          <line class="ray" style="--op:0.50"
            x1="152" y1="79"  x2="174" y2="54"
            stroke="#E06844" stroke-width="2" stroke-linecap="round"/>

          <!-- 9:30 / ~65° left -->
          <line class="ray" style="--op:0.36"
            x1="73"  y1="103" x2="42"  y2="90"
            stroke="#E06844" stroke-width="1.8" stroke-linecap="round"/>

          <!-- 2:30 / ~65° right -->
          <line class="ray" style="--op:0.36"
            x1="167" y1="103" x2="198" y2="90"
            stroke="#E06844" stroke-width="1.8" stroke-linecap="round"/>

          <!-- Far left (near horizontal) -->
          <line class="ray" style="--op:0.22"
            x1="72"  y1="124" x2="32"  y2="130"
            stroke="#E06844" stroke-width="1.4" stroke-linecap="round"/>

          <!-- Far right (near horizontal) -->
          <line class="ray" style="--op:0.22"
            x1="168" y1="124" x2="208" y2="130"
            stroke="#E06844" stroke-width="1.4" stroke-linecap="round"/>

          <!-- ── Sun circle (clipped above horizon) ── -->
          <circle cx="120" cy="118" r="52"
            fill="url(#sg)"
            clip-path="url(#above)"/>

          <!-- Subtle bright core highlight -->
          <ellipse cx="110" cy="104" rx="18" ry="14"
            fill="rgba(255,240,200,0.22)"
            clip-path="url(#above)"/>

          <!-- ── Horizon line ── -->
          <line x1="0" y1="148" x2="240" y2="148"
            stroke="#1B1928" stroke-width="1.2" opacity="0.14"/>

          <!-- Below-horizon ground tint -->
          <rect x="0" y="148" width="240" height="38"
            fill="rgba(224,104,68,0.05)"/>
        </svg>
      </div>

      <!-- ── Wordmark: Rise 瑞 ── -->
      <div class="wordmark">
        <span class="wm-en">Rise</span>
        <div class="wm-zh-wrap">
          <span class="wm-zh">瑞</span>
          <span class="wm-py">ruì</span>
        </div>
      </div>

      <!-- Vertical rule -->
      <div class="rule"></div>

      <!-- ── Slogan ── -->
      <div class="slogan">
        <span class="sl-line">
          别让<span class="sl-em">紧急的事</span>，
        </span>
        <span class="sl-line">
          埋掉<span class="sl-em">重要的你</span>。
        </span>
        <span class="sl-cta">Rise.</span>
      </div>

    </div><!-- /content -->

    <!-- Onboarding progress dots -->
    <div class="dots">
      <div class="dot on"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div><!-- /screen -->
</div><!-- /phone -->

</body>
</html>
